services:
  web:
    build: .
    restart: unless-stopped
    command: ["gunicorn", "--bind", "0.0.0.0:5173", "--workers", "1", "--threads", "8", "--timeout", "120", "--access-logfile", "-", "--access-logformat", "%(h)s %(r)s %(s)s %(b)s %(L)ssec", "app:app"]
    environment:
      DATA_DIR: /data
      PORT: 5173
      PLAYER_DIRECTORY_TOKEN: ${PLAYER_DIRECTORY_TOKEN:-}
    volumes:
      - ./cloud-data:/data
    expose:
      - "5173"
    cpu_shares: 1024
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:5173/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2300M

  workers:
    build: .
    restart: unless-stopped
    command: ["nice", "-n", "10", "python", "cloud_worker.py"]
    cpu_shares: 128
    # Compose's deploy limit was not applied to the ordinary (non-Swarm)
    # container. This runtime limit keeps archival research from saturating
    # every core needed by predictions and grading.
    cpus: "0.75"
    mem_limit: 1300M
    healthcheck:
      disable: true
    environment:
      DATA_DIR: /data
      PROCESS_ROLE: background
    volumes:
      - ./cloud-data:/data
    depends_on:
      web:
        condition: service_healthy
  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate --protocol http2 run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    network_mode: service:web
    depends_on:
      web:
        condition: service_healthy
