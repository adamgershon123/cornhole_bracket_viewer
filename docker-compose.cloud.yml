services:
  web:
    build: .
    restart: unless-stopped
    command: ["gunicorn", "--bind", "0.0.0.0:5173", "--workers", "2", "--threads", "4", "--timeout", "120", "--access-logfile", "-", "--access-logformat", "%(h)s %(r)s %(s)s %(b)s %(L)ssec", "app:app"]
    environment:
      DATA_DIR: /data
      PORT: 5173
      PLAYER_DIRECTORY_TOKEN: ${PLAYER_DIRECTORY_TOKEN:-}
    volumes:
      - ./cloud-data:/data
    expose:
      - "5173"
    cpu_shares: 1024
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:5173/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2300M

  collection-worker:
    build: .
    restart: unless-stopped
    command: ["nice", "-n", "8", "python", "collection_worker.py"]
    cpu_shares: 384
    cpus: "0.60"
    mem_limit: 600M
    healthcheck:
      disable: true
    environment:
      DATA_DIR: /data
      PROCESS_ROLE: background
      SKIP_DB_SCHEMA_INIT: 1
      COLLECTION_STARTUP_DELAY_SECONDS: 20
    volumes:
      - ./cloud-data:/data
    depends_on:
      web:
        condition: service_healthy

  operations-worker:
    build: .
    restart: unless-stopped
    command: ["nice", "-n", "5", "python", "operations_worker.py"]
    cpu_shares: 512
    cpus: "0.65"
    mem_limit: 700M
    healthcheck:
      disable: true
    environment:
      DATA_DIR: /data
      PROCESS_ROLE: background
      SKIP_DB_SCHEMA_INIT: 1
      OPERATIONS_STARTUP_DELAY_SECONDS: 20
    volumes:
      - ./cloud-data:/data
    depends_on:
      web:
        condition: service_healthy

  analytics-worker:
    build: .
    restart: unless-stopped
    command: ["nice", "-n", "15", "python", "analytics_worker.py"]
    cpu_shares: 64
    cpus: "0.35"
    mem_limit: 750M
    healthcheck:
      disable: true
    environment:
      DATA_DIR: /data
      PROCESS_ROLE: background
      SKIP_DB_SCHEMA_INIT: 1
      ANALYTICS_STARTUP_DELAY_SECONDS: 60
    volumes:
      - ./cloud-data:/data
    depends_on:
      web:
        condition: service_healthy

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate --protocol http2 run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    network_mode: service:web
    depends_on:
      web:
        condition: service_healthy
